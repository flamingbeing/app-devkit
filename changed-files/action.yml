name: Changed files
description: >-
  Says whether a pull request changes any app file, so a heavy job (browser tests, emulators) can skip its steps in
  seconds when it only changes docs. The job itself still runs and succeeds, so a required check never hangs. Pushes
  and every other event report `app=true`, as does anything unclear (a failed fetch, an empty diff).
inputs:
  ignore:
    description: >-
      Paths that do not count as app files, one shell pattern per line (`*` also matches `/`). The default is Markdown,
      docs/ and LICENSE.
    default: |
      *.md
      docs/*
      LICENSE
  keep:
    description: >-
      Paths that always count, one pattern per line, checked before `ignore` (so Markdown an app serves or tests read
      still runs the tests).
    default: |
      app/*
      e2e/*
      fixtures/*
outputs:
  app:
    description: "`true` when the browser jobs must run, `false` when only ignored files changed."
    value: ${{ steps.diff.outputs.app }}
runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        IGNORE: ${{ inputs.ignore }}
        KEEP: ${{ inputs.keep }}
      run: |
        if [ "$EVENT" != pull_request ]; then
          echo "app=true" >> "$GITHUB_OUTPUT"; echo "$EVENT: run everything"; exit 0
        fi
        # checkout is the PR's merge commit at depth 1; its first parent is the base, so one more level gives the diff
        if ! git fetch --no-tags --depth=2 origin "$GITHUB_SHA" >/dev/null 2>&1 \
           || ! files=$(git diff --no-renames --name-only HEAD^1 HEAD 2>/dev/null); then
          echo "app=true" >> "$GITHUB_OUTPUT"; echo "could not read the diff: run everything"; exit 0
        fi
        printf '%s\n' "$files" | bash "$GITHUB_ACTION_PATH/decide.sh" | tee -a "$GITHUB_OUTPUT" | sed 's/^/changed-files: /'
