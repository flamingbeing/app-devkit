# Runs every block of this kit on a tiny fixture, so a broken block fails here before an app calls it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: Secret-cleaning function
        run: bash scripts/test-clean.sh

  setup-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./setup-node
        with:
          working-directory: fixtures/node
      - run: node --version | grep -q '^v22\.'

  setup-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./setup-browser
        with:
          playwright-version: 1.56.1
      - name: Chromium is installed
        run: ls -d ~/.cache/ms-playwright/chromium-*
      - name: The kit's files are copied next to the app
        run: |
          test -f .devkit/playwright/base.mjs
          test -f .devkit/playwright/helpers.mjs
          test -f .devkit/rules/common.rules
          test -f .devkit/tools/build-rules.mjs
          test -f .devkit/worker/claims.js
          node .devkit/tools/check-links.mjs .

  playwright-kit:
    # base config + emulator helpers, run through the blocks the way an app uses them
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./setup-node
        with:
          working-directory: fixtures/playwright
      - uses: ./setup-browser
        with:
          playwright-version: 1.56.1
      - uses: ./setup-emulators
        with:
          emulators: firestore,auth
      - name: Fixture tests
        working-directory: fixtures/playwright
        run: npx playwright test

  rules-kit:
    # common.rules helpers, the builder and the shared suite, on the two worked examples (failing first, see NOTES.md)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./setup-emulators
        with:
          emulators: firestore
          devkit-dir: .devkit
      - name: The copy includes the rules kit
        run: test -f .devkit/rules/suite.mjs
      - name: Built example rules are up to date
        run: |
          node tools/build-rules.mjs rules/examples/single-group/firestore.app.rules --check
          node tools/build-rules.mjs rules/examples/multi-group/firestore.app.rules --check
      - name: Helpers, builder and examples in the emulator
        run: >-
          firebase emulators:exec --only firestore --project demo-rules-kit --config fixtures/rules/firebase.json
          "node --test rules/test/helpers.test.mjs rules/test/build.test.mjs
          rules/examples/single-group/rules.test.mjs rules/examples/multi-group/rules.test.mjs"

  worker-kit:
    # claims Worker modules: unit tests, then against the Auth and Firestore emulators (see NOTES.md)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./setup-emulators
        with:
          emulators: firestore,auth
      - name: Worker modules, unit and emulator tests
        run: >-
          firebase emulators:exec --only auth,firestore --project demo-claims-kit --config fixtures/claims/firebase.json
          "node --test worker/test/custom-token.test.mjs worker/test/claims.test.mjs worker/test/emulator.test.mjs"

  setup-emulators:
    # run twice in one job: the second run must hit the firebase-tools cache and not download
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        run: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./setup-emulators
        id: emu
        with:
          emulators: firestore,auth
      - name: Second run hits the firebase-tools cache
        if: matrix.run == 2
        env:
          HIT: ${{ steps.emu.outputs.firebase-tools-cache-hit }}
        run: test "$HIT" = true
      - name: Java, firebase and the Firestore emulator are installed
        run: |
          java -version 2>&1 | grep -q '"21'
          firebase --version | grep -qx '13.29.1'
          ls ~/.cache/firebase/emulators/cloud-firestore-emulator-*.jar
      - name: npx finds the same firebase-tools without downloading
        # cold, npx installs the package (about 10 s); from its cache it answers in about 2 s
        run: |
          start=$(date +%s.%N)
          npx --prefer-offline --yes firebase-tools@13.29.1 --version | grep -qx '13.29.1'
          took=$(echo "$(date +%s.%N) - $start" | bc)
          echo "npx took ${took}s"
          test "$(echo "$took < 6" | bc)" = 1

  deploy-worker-dry-run:
    uses: ./.github/workflows/deploy-worker.yml
    with:
      working-directory: fixtures/worker
      build-command: node build.mjs
      stamp-command: node stamp.mjs
      dry-run: true

  deploy-worker-skips:
    uses: ./.github/workflows/deploy-worker.yml
    with:
      working-directory: fixtures/worker

  deploy-rules-skips:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-rules.yml
