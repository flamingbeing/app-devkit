# Reusable: deploy a repo's Cloudflare Worker. Call it from a workflow that runs on push to main (and beta):
#   jobs:
#     deploy:
#       uses: flamingbeing/app-devkit/.github/workflows/deploy-worker.yml@v1
#       secrets: inherit
# The Cloudflare secrets are optional: without them the run says so and skips. A byte-order mark or trailing
# CR/LF on either secret (a common copy-paste artefact that makes wrangler fail) is stripped before use.
name: Deploy Worker

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      working-directory:
        description: Folder with wrangler.jsonc (and package.json).
        type: string
        default: '.'
      install:
        description: Run `npm ci` before the build.
        type: boolean
        default: false
      build-command:
        description: Build step run before the deploy (empty = none).
        type: string
        default: ''
      stamp-command:
        description: Step run after the build (for example stamping versions). Empty = none.
        type: string
        default: ''
      beta-env:
        description: A push to the `beta` branch deploys the Worker's `beta` environment.
        type: boolean
        default: true
      dry-run:
        description: Build and run `wrangler deploy --dry-run` (no secrets needed). Used by this repo's own checks.
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: deploy-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - name: Secrets present?
        id: gate
        run: |
          # clean-begin
          clean() { printf '%s' "$1" | sed '1s/^\xEF\xBB\xBF//' | tr -d '\r\n'; }
          # clean-end
          token="$(clean "$RAW_TOKEN")"
          account="$(clean "$RAW_ACCOUNT")"
          if [ "$DRY_RUN" = true ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$token" ] || [ -z "$account" ]; then
            echo "::notice::No Cloudflare secrets in this repo yet; skipping the deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$token"
            echo "::add-mask::$account"
            echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          fetch-depth: 0   # stamp steps often date each app by its last commit
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.install && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: npm ci
        if: steps.gate.outputs.go == 'true' && inputs.install
        working-directory: ${{ inputs.working-directory }}
        run: npm ci
      - name: Build
        if: steps.gate.outputs.go == 'true' && inputs.build-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          CMD: ${{ inputs.build-command }}
        run: bash -c "$CMD"
      - name: Stamp
        if: steps.gate.outputs.go == 'true' && inputs.stamp-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          CMD: ${{ inputs.stamp-command }}
        run: bash -c "$CMD"
      - name: Deploy
        if: steps.gate.outputs.go == 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          BETA_ENV: ${{ inputs.beta-env }}
        run: |
          args=()
          if [ "$BETA_ENV" = true ] && [ "$GITHUB_REF_NAME" = beta ]; then args+=(--env beta); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run --outdir /tmp/wrangler-out); fi
          npx --yes wrangler@4 deploy "${args[@]}"
